<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>برنامه من</title>
<link rel="manifest" href="manifest.webmanifest">
<style>body{margin:0;background:#12181f;color:#eaf3ee;font-family:system-ui;display:grid;place-items:center;height:100vh}</style>
</head>
<body><main><h1>برنامه من</h1><p>نسخه 1.0.0</p></main>
<script>import pygame
import random

pygame.init()

# تنظیمات صفحه
WIDTH = 600
HEIGHT = 400
CELL = 20

screen = pygame.display.set_mode((WIDTH, HEIGHT))
pygame.display.set_caption("Snake Game")

clock = pygame.time.Clock()

# رنگ‌ها
BLACK = (0, 0, 0)
WHITE = (255, 255, 255)
GREEN = (0, 200, 0)
RED = (220, 50, 50)
DARK_GREEN = (0, 120, 0)

font = pygame.font.SysFont("arial", 30)
small_font = pygame.font.SysFont("arial", 20)


def random_food(snake):
    while True:
        x = random.randrange(0, WIDTH, CELL)
        y = random.randrange(0, HEIGHT, CELL)

        if (x, y) not in snake:
            return (x, y)


def draw_text(text, font_type, color, x, y):
    image = font_type.render(text, True, color)
    screen.blit(image, (x, y))


def game():
    snake = [
        (300, 200),
        (280, 200),
        (260, 200)
    ]

    direction = "RIGHT"
    next_direction = "RIGHT"

    food = random_food(snake)
    score = 0
    game_over = False

    while not game_over:
        # رویدادها
        for event in pygame.event.get():
            if event.type == pygame.QUIT:
                pygame.quit()
                return

            if event.type == pygame.KEYDOWN:

                if event.key == pygame.K_UP and direction != "DOWN":
                    next_direction = "UP"

                elif event.key == pygame.K_DOWN and direction != "UP":
                    next_direction = "DOWN"

                elif event.key == pygame.K_LEFT and direction != "RIGHT":
                    next_direction = "LEFT"

                elif event.key == pygame.K_RIGHT and direction != "LEFT":
                    next_direction = "RIGHT"

        direction = next_direction

        # حرکت مار
        head_x, head_y = snake[0]

        if direction == "UP":
            new_head = (head_x, head_y - CELL)

        elif direction == "DOWN":
            new_head = (head_x, head_y + CELL)

        elif direction == "LEFT":
            new_head = (head_x - CELL, head_y)

        else:
            new_head = (head_x + CELL, head_y)

        # برخورد با دیوار
        if (
            new_head[0] < 0
            or new_head[0] >= WIDTH
            or new_head[1] < 0
            or new_head[1] >= HEIGHT
        ):
            game_over = True
            continue

        # برخورد با خودش
        if new_head in snake:
            game_over = True
            continue

        snake.insert(0, new_head)

        # خوردن غذا
        if new_head == food:
            score += 1
            food = random_food(snake)
        else:
            snake.pop()

        # رسم صفحه
        screen.fill(BLACK)

        # غذا
        pygame.draw.rect(
            screen,
            RED,
            (food[0], food[1], CELL, CELL)
        )

        # مار
        for i, part in enumerate(snake):
            color = GREEN if i == 0 else DARK_GREEN

            pygame.draw.rect(
                screen,
                color,
                (part[0], part[1], CELL, CELL)
            )

        draw_text(
            f"Score: {score}",
            small_font,
            WHITE,
            10,
            10
        )

        pygame.display.update()

        # سرعت بازی
        clock.tick(10 + score // 3)

    # صفحه پایان بازی
    screen.fill(BLACK)

    draw_text(
        "GAME OVER",
        font,
        RED,
        WIDTH // 2 - 100,
        HEIGHT // 2 - 50
    )

    draw_text(
        f"Final Score: {score}",
        small_font,
        WHITE,
        WIDTH // 2 - 70,
        HEIGHT // 2
    )

    draw_text(
        "Press R to Restart",
        small_font,
        WHITE,
        WIDTH // 2 - 90,
        HEIGHT // 2 + 40
    )

    pygame.display.update()

    waiting = True

    while waiting:
        for event in pygame.event.get():
            if event.type == pygame.QUIT:
                pygame.quit()
                return

            if event.type == pygame.KEYDOWN:
                if event.key == pygame.K_r:
                    game()
                    return


game()
pygame.quit()</script>
</body></html>
